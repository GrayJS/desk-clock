[package]
name = "morrow-desk-clock"
version = "0.5.0"
description = "A lightweight Windows 11 desktop clock and focus timer"
authors = ["Morrow"]
edition = "2021"

[lib]
name = "morrow_desk_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
