[package]
name = "morrow-desk-clock"
version = "0.6.7"
description = "A lightweight Windows 11 desktop clock and focus timer"
authors = ["Morrow"]
license = "MIT"
edition = "2021"

[lib]
name = "morrow_desk_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
